[package]
name = "rehue"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
description = "Map base16 color schemes and wallpapers onto each other, deterministically"

[dependencies]
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = true
codegen-units = 1