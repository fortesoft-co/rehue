# map-scheme ladders: the butterfly onto rose-pine-dawn; each strip shows
# the reference on top and the result below.

[[ladder]]
id = "scheme-blend-hue"
file = "assets/examples/options/scheme-blend-hue.png"
base = "map-scheme --wallpaper {butterfly} --scheme rose-pine-dawn --out {out}"
output = "preview.png"
width = 384
rungs = [
  { args = "", note = "blend-hue 1, the default" },
  { args = "--blend-hue 0.4" },
  { args = "--blend-hue 0", note = "the reference scheme verbatim" },
]

[[ladder]]
id = "scheme-distribution"
file = "assets/examples/options/scheme-distribution.png"
base = "map-scheme --wallpaper {butterfly} --scheme rose-pine-dawn --out {out}"
