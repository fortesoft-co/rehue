# Every documented command and every docs image, defined once.
#
# The docs render from this (README / EXAMPLES regions `run:ID` and
# `ladder:ID`, checked by `cargo test --test docs`), and the images are
# built from it:
#
#   nix develop .#examples -c cargo run --release --example docs-images
#
# `{name}` expands from [vars]; `{out}` is a run's output directory
# (shown as the run's `out` in the docs) and `{out:ID}` another run's.

[vars]
glitter = "assets/vidsplay-rainbow-glitter.webp"
butterfly = "assets/kelly-ishmael-butterfly-closeup.webp"
bango = "assets/bango-renders-3d-abstract.webp"

# ------------------------------------------------------------ README

[[run]]
id = "glitter"
args = "wal -i {glitter} -s gruvbox-light -o {out} -H 1"
out = "glitter"

[[image]]
file = "assets/examples/glitter-facade1-pair.webp"
kind = "montage"
tile = "2x1"
width = 960
cells = [
  { label = "before", src = "{glitter}" },
  { label = "gruvbox-light, harmonize 1", src = "{out:glitter}/wallpaper.png" },
]

[[run]]
id = "butterfly-mapped"
args = "scheme -i rose-pine-dawn -w {butterfly} -o {out}"
out = "mapped"

[[image]]
file = "assets/examples/butterfly-rose-pine-dawn.png"
kind = "copy"
cells = [{ src = "{out:butterfly-mapped}/preview.png" }]

[[run]]
id = "butterfly-repainted"
args = "wal -i {butterfly} -s {out:butterfly-mapped}/scheme.yaml -o {out} -H 1"
out = "repainted"

[[image]]
file = "assets/examples/butterfly-roundtrip-pair.webp"
kind = "montage"
tile = "2x1"
width = 480
cells = [
  { label = "before", src = "{butterfly}" },
  { label = "rose-pine-dawn (re-hued), harmonize 1", src = "{out:butterfly-repainted}/wallpaper.png" },
]

[[run]]
id = "bango-mapped"
args = "scheme -i tokyo-night-dark -w {bango} -o {out}"
out = "mapped"

[[image]]
file = "assets/examples/bango-schemes-roundtrip.png"
kind = "copy"
cells = [{ src = "{out:bango-mapped}/preview.png" }]

[[run]]
id = "bango-repainted"
args = "wal -i {bango} -s {out:bango-mapped}/scheme.yaml -o {out} -H 1"
out = "repainted"

[[image]]
file = "assets/examples/bango-roundtrip-pair.webp"
kind = "montage"
tile = "2x1"
width = 480
cells = [
  { label = "before", src = "{bango}" },
  { label = "tokyo-night-dark (re-hued)", src = "{out:bango-repainted}/wallpaper.png" },
]

[[image]]
file = "assets/examples/preview-palette.webp"
kind = "shot"
views = ["palette"]
cells = [{ src = "{out:bango-repainted}/preview.html" }]

[[image]]
file = "assets/examples/preview-toolkits.webp"
kind = "shot"
views = ["gtk", "qt"]
cells = [{ src = "{out:bango-repainted}/preview.html" }]

[[run]]
id = "inspect-butterfly"
args = "inspect -w {butterfly} -o {out}"
out = "inspect"

[[image]]
file = "assets/examples/inspect-families.png"
kind = "scale"
scale = 300
cells = [{ src = "{out:inspect-butterfly}/inspect.png" }]

[[ladder]]
id = "grading-groups"
file = "assets/examples/grading-groups.png"
base = "scheme -i rose-pine-dawn -w {butterfly} -o {out}"
output = "preview.png"
width = 384
rungs = [
  { args = "" },
  { args = "--chroma accents 1.6" },
  { args = "--lightness foreground -0.1" },
  { args = "--assign accents 0,1,2,3 --cycle accents 1" },
]

# ---------------------------------------------------------- EXAMPLES
# wal ladders: bango + gruvbox-light, each opening with the original.

[[ladder]]
id = "wal-mode"
file = "assets/examples/options/wal-mode.webp"
base = "wal -i {bango} -s gruvbox-light -o {out}"
output = "wallpaper.png"
original = "{bango}"
rungs = [
  { args = "--harmonize 1", note = "blend (the default), harmonize 1" },
  { args = "--harmonize 1 --mode snap", note = "snap, harmonize 1" },
]

[[ladder]]
id = "wal-harmonize"
file = "assets/examples/options/wal-harmonize.webp"
base = "wal -i {bango} -s gruvbox-light -o {out}"
output = "wallpaper.png"
original = "{bango}"
rungs = [{ args = "--harmonize 0.5" }, { args = "--harmonize 1" }]

[[ladder]]
id = "wal-match-hue"
file = "assets/examples/options/wal-match-hue.webp"
base = "wal -i {bango} -s gruvbox-light -o {out}"
output = "wallpaper.png"
original = "{bango}"
rungs = [{ args = "--match-hue 0.6" }, { args = "--match-hue 1" }]

[[ladder]]
id = "wal-match-chroma"
file = "assets/examples/options/wal-match-chroma.webp"
base = "wal -i {bango} -s gruvbox-light -o {out}"
output = "wallpaper.png"
original = "{bango}"
rungs = [{ args = "--match-chroma 0.6" }, { args = "--match-chroma 1" }]

[[ladder]]
id = "wal-match-lightness"
file = "assets/examples/options/wal-match-lightness.webp"
base = "wal -i {bango} -s gruvbox-light -o {out}"
output = "wallpaper.png"
original = "{bango}"
rungs = [{ args = "--match-lightness 0.5" }, { args = "--match-lightness 1" }]

[[ladder]]
id = "wal-reach"
file = "assets/examples/options/wal-reach.webp"
base = "wal -i {bango} -s gruvbox-light -o {out}"
output = "wallpaper.png"
original = "{bango}"
common = "--harmonize 1"
rungs = [
  { args = "--reach 15" },
  { args = "--reach 45", note = "the default" },
  { args = "--reach 140" },
]

[[ladder]]
id = "wal-max-gray-chroma"
file = "assets/examples/options/wal-max-gray-chroma.webp"
base = "wal -i {bango} -s gruvbox-light -o {out}"
output = "wallpaper.png"
original = "{bango}"
common = "--harmonize 1"
rungs = [
  { args = "--max-gray-chroma 0" },
  { args = "--max-gray-chroma 0.02", note = "the default" },
  { args = "--max-gray-chroma 0.12" },
]

[[ladder]]
id = "wal-dithering"
file = "assets/examples/options/wal-dithering.webp"
base = "wal -i {bango} -s gruvbox-light -o {out}"
output = "wallpaper.png"
original = "{bango}"
common = "--mode snap --match-hue 1 --match-lightness 0.5 --match-chroma 0.9"
rungs = [
  { args = "--dithering 0" },
  { args = "--dithering 0.5" },
  { args = "--dithering 1" },
]

[[ladder]]
id = "wal-dithering-mode"
file = "assets/examples/options/wal-dithering-mode.webp"
base = "wal -i {bango} -s gruvbox-light -o {out}"
output = "wallpaper.png"
original = "{bango}"
width = 380
common = "--mode snap --match-hue 1 --match-lightness 0.5 --match-chroma 0.9 --dithering 1"
rungs = [
  { args = "--dithering-mode blue-noise" },
  { args = "--dithering-mode bayer" },
  { args = "--dithering-mode floyd-steinberg" },
  { args = "--dithering-mode atkinson" },
]

[[ladder]]
id = "wal-assign"
file = "assets/examples/options/wal-assign.webp"
base = "wal -i {bango} -s gruvbox-light -o {out}"
output = "wallpaper.png"
original = "{bango}"
common = "--harmonize 1"
rungs = [
  { args = "", note = "no assign" },
  { args = "--assign accents 0,1,2,3" },
  { args = "--assign accents 0,1,2,3 --cycle accents 1", note = "...and cycle" },
]

[[ladder]]
id = "wal-lightness"
file = "assets/examples/options/wal-lightness.webp"
base = "wal -i {bango} -s gruvbox-light -o {out}"
output = "wallpaper.png"
original = "{bango}"
rungs = [{ args = "--lightness -0.1" }, { args = "--lightness 0.1" }]

[[ladder]]
id = "wal-chroma"
file = "assets/examples/options/wal-chroma.webp"
base = "wal -i {bango} -s gruvbox-light -o {out}"
output = "wallpaper.png"
original = "{bango}"
rungs = [{ args = "--chroma 0.6" }, { args = "--chroma 1.4" }]

[[ladder]]
id = "wal-role-grades"
file = "assets/examples/options/wal-role-grades.webp"
base = "wal -i {bango} -s gruvbox-light -o {out}"
output = "wallpaper.png"
original = "{bango}"
rungs = [{ args = "--chroma accents 1.6" }, { args = "--chroma foreground 0.5" }]

# scheme ladders: the butterfly onto rose-pine-dawn; each strip shows
# the reference on top and the result below.

[[ladder]]
id = "scheme-match-hue"
file = "assets/examples/options/scheme-match-hue.png"
base = "scheme -i rose-pine-dawn -w {butterfly} -o {out}"
output = "preview.png"
width = 384
rungs = [
  { args = "", note = "match-hue 1, the default" },
  { args = "--match-hue 0.4" },
  { args = "--match-hue 0", note = "the reference scheme verbatim" },
]

[[ladder]]
id = "scheme-assign"
file = "assets/examples/options/scheme-assign.png"
base = "scheme -i rose-pine-dawn -w {butterfly} -o {out}"
output = "preview.png"
width = 384
rungs = [
  { args = "", note = "defaults: accents claim, the rest take the heaviest family" },
  { args = "--assign accents 0,1,2,3" },
  { args = "--assign surfaces auto --assign foreground auto", note = "surfaces and foreground spread across the families" },
]

[[ladder]]
id = "scheme-cycle"
file = "assets/examples/options/scheme-cycle.png"
base = "scheme -i rose-pine-dawn -w {butterfly} -o {out}"
output = "preview.png"
width = 384
common = "--assign accents 0,1,2,3"
rungs = [
  { args = "" },
  { args = "--cycle accents 1" },
  { args = "--cycle accents 3" },
]

[[ladder]]
id = "scheme-chroma"
file = "assets/examples/options/scheme-chroma.png"
base = "scheme -i rose-pine-dawn -w {butterfly} -o {out}"
output = "preview.png"
width = 384
rungs = [{ args = "--chroma accents 0.75" }, { args = "--chroma accents 1.6" }]

[[ladder]]
id = "scheme-reach"
file = "assets/examples/options/scheme-reach.png"
base = "scheme -i rose-pine-dawn -w {butterfly} -o {out}"
output = "preview.png"
width = 384
rungs = [
  { args = "--reach 20" },
  { args = "--reach 45", note = "the default" },
  { args = "--reach 90" },
]

# extraction: inspect on the butterfly (config-only options)

[[ladder]]
id = "extract-max-families"
file = "assets/examples/options/extract-max-families.png"
base = "inspect -w {butterfly} -o {out}"
output = "inspect.png"
width = 384
rungs = [
  { config = { max-families = 2 } },
  { config = { max-families = 4 } },
  { config = { max-families = 6 }, note = "the default" },
]
